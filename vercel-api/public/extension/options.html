<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Sync</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1>SESSION // SYNC</h1>
  <p class="hint">These values are stored in this browser profile only. Anyone with access to this browser can read them.</p>

  <h2>Instagram</h2>
  <label>Server URL
    <input id="serverUrl" placeholder="https://instagram-mcp-api.vercel.app" autocomplete="off"></label>
  <label>MCP key (MCP_AUTH_KEY)
    <input id="mcpKey" type="password" autocomplete="off"></label>
  <label>Encryption key (SESSION_ENCRYPTION_KEY, same as Vercel)
    <input id="encKey" type="password" autocomplete="off"></label>
  <label>Instagram username (optional)
    <input id="username" autocomplete="off"></label>

  <h2>Gemini</h2>
  <label>Gemini Archive server URL
    <input id="geminiUrl" placeholder="https://webapi-your-project.vercel.app" autocomplete="off"></label>
  <label>Sync key (GEMINI_SYNC_KEY on that server)
    <input id="geminiKey" type="password" autocomplete="off"></label>

  <h2>Automatic sync</h2>
  <label>Sync each site at most once every
    <select id="intervalMin">
      <option value="30">30 minutes</option>
      <option value="60">1 hour</option>
      <option value="120">2 hours</option>
    </select></label>
  <div class="row">
    <button id="save">SAVE</button>
    <button id="test" class="alt">TEST INSTAGRAM SERVER</button>
  </div>
  <div class="row">
    <button id="sync" class="alt">SYNC INSTAGRAM</button>
    <button id="syncGemini" class="alt">SYNC GEMINI</button>
  </div>
  <pre id="out" aria-live="polite"></pre>
  <p class="hint">Last Instagram sync: <span id="last">never</span></p>
  <p class="hint">Last Gemini sync: <span id="lastGemini">never</span></p>
</main>
<script src="options.js"></script>
</body>
</html>
